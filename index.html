<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f2">
<meta http-equiv="refresh" content="3; url=https://second-syntax.com/text-style/">
<link rel="canonical" href="https://second-syntax.com/text-style/">
<meta name="description" content="글씨 뚝딱은 second-syntax.com/text-style/ 로 옮겼어요.">
<title>글씨 뚝딱 — 새 주소로 옮겼어요</title>
<style>
:root{--bg:#f7f7f2;--ink:#25291f;--muted:#707668;--line:#dfe3d7;--lime:#dcf78b;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:420px;margin:0 auto;padding:calc(48px + env(safe-area-inset-top)) 20px 32px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.6px}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--lime);font:italic 700 20px Georgia,serif}
h1{margin:8px 0 0;font-size:22px;letter-spacing:-.6px}p{margin:0;font-size:14px;line-height:1.6;color:var(--muted)}
.go{display:block;text-align:center;padding:14px 16px;border-radius:12px;background:var(--lime);color:var(--ink);font-weight:750;text-decoration:none;border:1px solid #c7e36f}.go:focus-visible{outline:2px solid #8261be;outline-offset:2px}
.url{font-size:13px;color:var(--ink);word-break:break-all}
</style>
</head>
<body>
<main>
<div class="brand"><span class="mark" aria-hidden="true">Aa</span>글씨 뚝딱</div>
<h1>새 주소로 옮겼어요</h1>
<p>글씨 뚝딱은 이제 SECOND SYNTAX 사이트에서 써요. 키보드에 없는 글씨를 메신저에 그대로 보낼 수 있어요.</p>
<a class="go" href="https://second-syntax.com/text-style/">새 주소로 가기</a>
<p class="url">https://second-syntax.com/text-style/</p>
<p>3초 뒤 저절로 넘어가요. 즐겨찾기나 홈 화면에 넣어 두셨다면 새 주소로 다시 넣어 주세요.</p>
</main>
</body>
</html>
